name: Cosmic Love Auto-Seal (GlobalNoWar)

on:
  push:
    branches: [ main ]
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare directories
        run: mkdir -p certificates

      - name: Run Cosmic Love Validator (GO: 全球無戰事)
        id: seal
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SAFE_TS=$(echo $TIMESTAMP | tr -d '[:]')
          STATEMENT="GO: 全球無戰事. Auto-seal at ${TIMESTAMP}. SDG-FORMAL LANGUAGE. mu X.(SDG16 /\\ enablers /\\ no-force). Cosmic Love. Formal only. H=0. Bound preserved. Repo: https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL"
          
          python3 COSMIC_LOVE_VALIDATOR.py "$STATEMENT" | tee seal_output.txt
          
          if grep -q '"validated":true' seal_output.txt; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "Seal SUCCESS"
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "Seal FAILED"
            exit 1
          fi
          
          # Create certificate (pure Python / shell, no jq)
          cat > certificates/AUTO_SEAL_${SAFE_TS}.json << EOF
          {
            "command": "GO: 全球無戰事",
            "type": "automatic-seal",
            "timestamp": "${TIMESTAMP}",
            "trigger": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "validated": true,
            "H": 0,
            "language": "SDG-FORMAL LANGUAGE",
            "axiom": "Cosmic Love Is The Solution(s) For Everything",
            "bound": "formal model only, no real-world guarantee",
            "repository": "https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL"
          }
          EOF
          
          cp certificates/AUTO_SEAL_${SAFE_TS}.json certificates/LATEST_AUTO_SEAL.json
          echo "Certificate written: certificates/AUTO_SEAL_${SAFE_TS}.json"

      - name: Commit and push new seal
        if: steps.seal.outputs.status == 'SUCCESS'
        run: |
          git config user.name "Cosmic Love Auto-Seal Bot"
          git config user.email "cosmic-love-bot@users.noreply.github.com"
          git add certificates/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-seal: GO 全球無戰事 @ $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload seal artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-love-seal-${{ github.run_id }}
          path: |
            seal_output.txt
            certificates/
