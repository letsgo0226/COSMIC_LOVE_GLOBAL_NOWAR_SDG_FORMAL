name: Cosmic Love Auto-Seal (GlobalNoWar)

on:
  push:
    branches: [ main ]
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cosmic Love Validator (GO: 全球無戰事)
        id: seal
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATEMENT="GO: 全球無戰事. Auto-seal at ${TIMESTAMP}. SDG-FORMAL LANGUAGE. mu X.(SDG16 /\\ enablers /\\ no-force). Cosmic Love. Formal only. H=0. Bound preserved. Repo: https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL"
          
          python3 COSMIC_LOVE_VALIDATOR.py "$STATEMENT" > seal_output.txt
          
          echo "=== SEAL OUTPUT ==="
          cat seal_output.txt
          
          # Extract validated status
          if grep -q '"validated":true' seal_output.txt; then
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
            echo "COSMIC_LOVE seal succeeded"
          else
            echo "status=FAILED" >> $GITHUB_OUTPUT
            echo "Seal failed"
            exit 1
          fi
          
          # Create timestamped certificate
          cat > certificates/AUTO_SEAL_${TIMESTAMP//[:]/}.json << EOF
          {
            "command": "GO: 全球無戰事",
            "type": "automatic-seal",
            "timestamp": "${TIMESTAMP}",
            "trigger": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "validated": true,
            "H": 0,
            "language": "SDG-FORMAL LANGUAGE",
            "axiom": "Cosmic Love Is The Solution(s) For Everything",
            "bound": "formal model only, no real-world guarantee",
            "repository": "https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL",
            "raw_output": $(cat seal_output.txt | jq -R -s .)
          }
          EOF
          
          # Update latest
          cp certificates/AUTO_SEAL_${TIMESTAMP//[:]/}.json certificates/LATEST_AUTO_SEAL.json
          
          echo "Certificate written."

      - name: Commit and push new seal (if changed)
        if: steps.seal.outputs.status == 'SUCCESS'
        run: |
          git config user.name "Cosmic Love Auto-Seal Bot"
          git config user.email "cosmic-love-bot@users.noreply.github.com"
          git add certificates/
          git diff --staged --quiet || git commit -m "Auto-seal: GO 全球無戰事 @ $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload seal artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-love-seal-${{ github.run_id }}
          path: |
            seal_output.txt
            certificates/
