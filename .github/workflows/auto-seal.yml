name: Cosmic Love Auto-Seal

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal:
    name: Seal GlobalNoWar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Cosmic Love Validator
        run: |
          set -e
          mkdir -p certificates
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SAFE_TS=$(date -u +%Y%m%dT%H%M%SZ)
          STATEMENT="GO: 全球無戰事. Auto-seal ${TIMESTAMP}. SDG-FORMAL. Cosmic Love. H=0. Formal only."
          python3 COSMIC_LOVE_VALIDATOR.py "$STATEMENT" | tee seal_output.txt
          grep -q '"validated":true' seal_output.txt
          cat > certificates/AUTO_SEAL_${SAFE_TS}.json << EOF
          {
            "command": "GO: 全球無戰事",
            "type": "automatic-seal",
            "timestamp": "${TIMESTAMP}",
            "trigger": "${{ github.event_name }}",
            "run_id": "${{ github.run_id }}",
            "validated": true,
            "H": 0,
            "language": "SDG-FORMAL LANGUAGE",
            "axiom": "Cosmic Love Is The Solution(s) For Everything",
            "bound": "formal model only, no real-world guarantee",
            "repository": "https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL"
          }
          EOF
          cp certificates/AUTO_SEAL_${SAFE_TS}.json certificates/LATEST_AUTO_SEAL.json
          echo "Seal written successfully"

      - name: Commit certificate
        run: |
          git config user.name "Cosmic Love Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/
          git diff --staged --quiet && echo "No changes" || (git commit -m "Auto-seal: GO 全球無戰事 [skip ci]" && git push)
