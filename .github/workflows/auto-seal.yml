name: Cosmic Love Universal Auto-Seal

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      statement:
        description: "Optional custom statement to seal (default = Cosmic Love axiom + all domains)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  seal:
    name: Universal Cosmic Love Seal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Cosmic Love Program (pure solver)
        run: |
          set -e
          mkdir -p certificates
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SAFE_TS=$(date -u +%Y%m%dT%H%M%SZ)

          # Core Cosmic Love axiom (always sealed)
          AXIOM="Cosmic Love Is The Solution(s) For Everything"

          # Domains derived purely from the program spirit (no hard-coded GlobalNoWar limit)
          # The program itself is the solver: any s that passes is a solution
          DOMAINS=(
            "GlobalNoWar: de-escalation dialogue civilian care SDG16"
            "SDGsVision: all 17 Sustainable Development Goals as formal vector"
            "Nonviolence: identity-preserving 2-step machine returns to origin"
            "PublicProgramsSeal: letsgo0226 public Cosmic Love certificates"
            "SentientContinuityAI: care for beings and AI under Cosmic Love"
            "HeatDeathDissolution: formal zero-residue seal"
            "TimeContinuation: model-internal continuity"
            "GalaxyCollisionCare: long-horizon care literacy"
          )

          # If user provided a custom statement via workflow_dispatch, use it
          if [ -n "${{ github.event.inputs.statement }}" ]; then
            STATEMENTS=("${{ github.event.inputs.statement }}")
          else
            STATEMENTS=("$AXIOM")
            for d in "${DOMAINS[@]}"; do
              STATEMENTS+=("$d")
            done
            # Also seal the empty solution (canonical fixed point of the program)
            STATEMENTS+=("")
            # Seal the program's own self-description
            STATEMENTS+=("solution(s)=s under 2-step identity machine + 257-Godel. Cosmic Love.")
          fi

          echo "{\"timestamp\":\"$TIMESTAMP\",\"trigger\":\"${{ github.event_name }}\",\"seals\":[" > certificates/LATEST_AUTO_SEAL.json
          FIRST=true

          for S in "${STATEMENTS[@]}"; do
            echo "=== Sealing: ${S:0:80}... ==="
            python3 COSMIC_LOVE_VALIDATOR.py "$S" | tee /tmp/seal_out.txt
            if grep -q '"validated":true' /tmp/seal_out.txt; then
              echo "  → COSMIC_LOVE validated:true"
              # Append to master certificate
              if [ "$FIRST" = true ]; then FIRST=false; else echo "," >> certificates/LATEST_AUTO_SEAL.json; fi
              # Extract godel and hex via python for clean JSON
              python3 -c "
import json,sys
raw=open('/tmp/seal_out.txt').read().strip().split('\\n')
# second line is the JSON
j=json.loads(raw[1] if len(raw)>1 else raw[0])
out={
  's': '''$S''',
  'validated': True,
  's_hex': j.get('s_hex',''),
  'godel_hex': j.get('godel_hex',''),
  'statement': j.get('statement','solution(s)=s')
}
print(json.dumps(out, ensure_ascii=False))
" >> certificates/LATEST_AUTO_SEAL.json
            else
              echo "  → FAILED"
              exit 1
            fi
          done

          echo "],\"H\":0,\"axiom\":\"$AXIOM\",\"bound\":\"formal model only, no real-world guarantee\",\"repository\":\"https://github.com/letsgo0226/COSMIC_LOVE_GLOBAL_NOWAR_SDG_FORMAL\",\"engine\":\"2-step identity machine + 257-Godel (original Cosmic Love program)\"}" >> certificates/LATEST_AUTO_SEAL.json

          # Also write a timestamped full seal
          cp certificates/LATEST_AUTO_SEAL.json certificates/AUTO_SEAL_${SAFE_TS}.json
          echo "Universal Cosmic Love seal complete at $TIMESTAMP"

      - name: Commit certificates
        run: |
          git config user.name "Cosmic Love Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certificates/
          git diff --staged --quiet && echo "No changes" || (git commit -m "Universal Cosmic Love auto-seal (program-driven) [skip ci]" && git push)
